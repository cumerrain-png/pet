# 信源可随时增删。type: google_news | rss
# track: conflict | warm | hot
# 谷歌检索 when:1d，再由采集器按中国时区自然日过滤；collect 需挂梯子
# trust_query: true 表示检索式本身已限定宠物，不再套中文关键词（用于英/日/韩等）

sources:
  # ========== 冲突 ==========
  - id: gn_enter
    name: 冲突-进店上桌
    track: conflict
    type: google_news
    query: "(宠物进店 OR 宠物上桌 OR 禁宠令 OR 老乡鸡 狗) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: gn_bite
    name: 冲突-咬人伤人
    track: conflict
    type: google_news
    query: "(狗咬人 OR 恶犬 OR 猫抓伤 OR 流浪狗袭击) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: gn_dispute
    name: 冲突-争议纠纷
    track: conflict
    type: google_news
    query: "(宠物 争议 OR 宠物 纠纷 OR 宠物 风波 OR 养宠 对立) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: gn_enforce
    name: 冲突-执法弃养
    track: conflict
    type: google_news
    query: "(宠物被罚 OR 弃养 OR 黑心繁殖场 OR 理赔遭拒 OR 犬吠 投诉) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: gn_stray
    name: 冲突-流浪捕捉
    track: conflict
    type: google_news
    query: "(流浪狗 捕捉 OR 流浪猫 冲突 OR 禁喂 OR 渔护署 狗) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: gn_viral
    name: 冲突-被曝回应
    track: conflict
    type: google_news
    query: "(宠物 被曝 OR 宠物狗 上桌 OR 火锅 宠物) when:1d"
    hl: "zh-CN"
    gl: "CN"
    ceid: "CN:zh-Hans"
    enabled: true
    lang: zh

  - id: bing_conflict
    name: Bing-宠物冲突
    track: conflict
    type: rss
    url: "https://www.bing.com/news/search?q=%E7%8B%97%E5%92%AC%E4%BA%BA+OR+%E5%AE%A0%E7%89%A9%E8%BF%9B%E5%BA%97+OR+%E7%A6%81%E5%AE%A0&format=rss"
    enabled: true
    lang: zh

  # ========== 温馨 ==========
