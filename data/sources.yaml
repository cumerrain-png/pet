    enabled: true
    lang: zh

  # 英文生活向（温馨/趣味，produce 会写成中文）；需要更多英文素材时保持开启
  - id: dogster
    name: Dogster
    track: warm
    type: rss
    url: "https://www.dogster.com/feed"
    enabled: true
    lang: en

  - id: catster
    name: Catster
    track: warm
    type: rss
    url: "https://www.catster.com/feed"
    enabled: true
    lang: en

  - id: petsradar
    name: PetsRadar
    track: warm
    type: rss
    url: "https://www.petsradar.com/feeds/all"
    enabled: false
    lang: en

  # 海外暖闻/讨论。英文源不强制中文暖词。
  # Reddit 合并成一条，避免连续请求被 429。
  # The Dodo、PetMD 官网 feed 无条目，改走谷歌新闻站内检索。
  - id: reddit_pets
    name: Reddit-aww/pets
    track: warm
    type: rss
    url: "https://www.reddit.com/r/aww+pets+cats+dogs/.rss"
    enabled: true
    lang: en

  - id: gn_dodo
    name: The Dodo
    track: warm
    type: google_news
    query: "site:thedodo.com when:1d"
    hl: "en-US"
    gl: "US"
    ceid: "US:en"
    enabled: true
    lang: en

  - id: gn_petmd
    name: PetMD
    track: warm
    type: google_news
    query: "site:petmd.com when:1d"
    hl: "en-US"
    gl: "US"
    ceid: "US:en"
    enabled: true
    lang: en

  - id: akc
    name: AKC Expert Advice
    track: warm
    type: rss
    url: "https://www.akc.org/expert-advice/feed/"
    enabled: true
    lang: en

